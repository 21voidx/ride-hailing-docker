version: 2

models:
  - name: stg_cdc__rides
    description: >
      Current state of rides from Debezium CDC. Timestamps cast from STRING.
      Rows with __op = 'd' (deletes) are excluded. Adds ride_date in WIB.
    columns:
      - name: ride_id
        description: Surrogate primary key from source.
        tests: [not_null, unique]
      - name: rider_id
        description: FK to user_account.user_id.
        tests: [not_null]
      - name: driver_id
        description: FK to driver_profile.driver_id (nullable until accepted).
      - name: vehicle_id
        description: FK to vehicle.vehicle_id (nullable until accepted).
      - name: ride_status
        description: Current ride lifecycle status.
        tests:
          - not_null
          - accepted_values:
              values: [REQUESTED, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED, PAYMENT_FAILED]
      - name: service_type
        description: Ride tier / vehicle class.
        tests:
          - not_null
          - accepted_values:
              values: [BIKE, CAR, XL]
      - name: city_code
        description: City identifier.
        tests: [not_null]
      - name: requested_at
        description: Timestamp the ride was requested (cast from Debezium STRING).
        tests: [not_null]
      - name: estimated_distance_km
        description: Estimated trip distance in kilometres (> 0).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: true
      - name: estimated_duration_min
        description: Estimated trip duration in minutes (> 0).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: true
      - name: ride_date
        description: Ride date in Asia/Jakarta timezone derived from requested_at.
        tests: [not_null]
      - name: __op
        description: CDC operation code (c/r/u — d rows are filtered out).
        tests: [not_null]
      - name: __lsn
        description: PostgreSQL LSN for ordering CDC events.
        tests: [not_null]
      - name: __source_ts_ms
        description: CDC source timestamp in milliseconds since epoch.
        tests: [not_null]

  - name: stg_cdc__driver_profiles
    description: >
      Current state of driver profiles from Debezium CDC. Derives boolean flags
      from driver_status and verification_status.
    columns:
      - name: driver_id
        tests: [not_null, unique]
      - name: user_id
        tests: [not_null, unique]
      - name: license_number
        tests: [not_null]
      - name: driver_status
        tests:
          - not_null
          - accepted_values:
              values: [AVAILABLE, ON_RIDE, OFFLINE, SUSPENDED]
      - name: verification_status
        tests:
          - not_null
          - accepted_values:
              values: [PENDING, VERIFIED, REJECTED]
      - name: rating_avg
        description: Average driver rating (1.00–5.00).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1.0
              max_value: 5.0
      - name: rating_count
        description: Total number of ratings received (>= 0).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: is_verified
        description: True when verification_status = 'VERIFIED'.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_suspended
        description: True when driver_status = 'SUSPENDED'.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: __source_ts_ms
        tests: [not_null]

  - name: stg_cdc__payment_transactions
    description: >
      Current state of payment transactions from Debezium CDC.
      Derives boolean payment-status flags.
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: ride_id
        tests: [not_null]
      - name: user_payment_method_id
        tests: [not_null]
      - name: provider_name
        tests: [not_null]
      - name: amount
        description: Transaction amount (>= 0).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: method_fee
        description: Payment method fee (>= 0, default 0).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: payment_status
        tests:
          - not_null
          - accepted_values:
              values: [AUTHORIZED, CAPTURED, PAID, FAILED, REFUNDED]
      - name: is_paid
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_failed
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_refunded
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: __source_ts_ms
        tests: [not_null]

  - name: stg_cdc__ride_events
    description: >
      Append-only CDC event log for rides. All events including deletes are retained.
      Filtered by _PARTITIONTIME (last 30 days) via cdc_partition_filter().
    columns:
      - name: ride_id
        tests: [not_null]
      - name: __op
        description: CDC operation — all values retained (c/r/u/d).
        tests: [not_null]
      - name: __lsn
        tests: [not_null]
      - name: __source_ts_ms
        tests: [not_null]

  - name: stg_cdc__payment_transaction_events
    description: >
      Append-only CDC event log for payment transactions.
      Filtered by _PARTITIONTIME (last 30 days) via cdc_partition_filter().
    columns:
      - name: transaction_id
        tests: [not_null]
      - name: payment_status
        tests:
          - not_null
          - accepted_values:
              values: [AUTHORIZED, CAPTURED, PAID, FAILED, REFUNDED]
      - name: __op
        tests: [not_null]
      - name: __lsn
        tests: [not_null]
      - name: __source_ts_ms
        tests: [not_null]
