version: 2

models:
  - name: agg_ride_daily
    description: >
      Daily ride aggregates by city_code + service_type.
      Surrogate key on (city_code, service_type, ride_date).
    columns:
      - name: agg_key
        tests: [not_null, unique]
      - name: ride_date
        tests: [not_null]
      - name: city_code
        tests: [not_null]
      - name: service_type
        tests:
          - not_null
          - accepted_values:
              values: [BIKE, CAR, XL]
      - name: total_rides
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: completed_rides
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_revenue
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: agg_driver_daily
    description: >
      Daily driver activity aggregates.
      Surrogate key on (driver_id, activity_date).
    columns:
      - name: agg_key
        tests: [not_null, unique]
      - name: driver_id
        tests: [not_null]
      - name: activity_date
        tests: [not_null]
      - name: total_trips
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_earning
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: agg_revenue_daily
    description: >
      Daily revenue aggregates by city_code + service_type.
      Surrogate key on (city_code, service_type, revenue_date).
    columns:
      - name: agg_key
        tests: [not_null, unique]
      - name: revenue_date
        tests: [not_null]
      - name: city_code
        tests: [not_null]
      - name: service_type
        tests:
          - not_null
          - accepted_values:
              values: [BIKE, CAR, XL]
      - name: gross_revenue
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: net_revenue
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: agg_rider_monthly
    description: >
      Monthly rider activity aggregates.
      Surrogate key on (user_id, activity_month).
    columns:
      - name: agg_key
        tests: [not_null, unique]
      - name: user_id
        tests: [not_null]
      - name: activity_month
        tests: [not_null]
      - name: monthly_rides
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: monthly_spend
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: agg_promo_summary
    description: >
      Daily promo usage aggregates per promotion.
      Surrogate key on (promotion_id, usage_date).
    columns:
      - name: agg_key
        tests: [not_null, unique]
      - name: promotion_id
        tests: [not_null]
      - name: usage_date
        tests: [not_null]
      - name: usage_count
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_discount_applied
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
