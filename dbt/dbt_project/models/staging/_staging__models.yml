version: 2

models:
  # ── CDC-backed staging (source: dev_bronze_cdc_events) ─────────────────────
  # Timestamps di-cast dari STRING, ada deduplication via __lsn

  - name: stg_ride
    description: "State terbaru ride dari CDC events (ride_events). Timestamps di-cast dari STRING Debezium ke TIMESTAMP. Deduplicated: 1 row per ride_id, ambil LSN tertinggi."
    columns:
      - name: ride_id
        tests: [not_null, unique]
      - name: rider_id
        tests: [not_null]
      - name: ride_status
        tests:
          - accepted_values:
              arguments:
                values: ['REQUESTED','ACCEPTED','ARRIVED','IN_PROGRESS','COMPLETED','CANCELLED','PAYMENT_FAILED']
      - name: service_type
        tests:
          - accepted_values:
              arguments:
                values: ['BIKE','CAR','XL']
      - name: _cdc_op
        description: "CDC operation code setelah dedup (seharusnya c atau u)."
      - name: _cdc_lsn
        tests: [not_null]

  - name: stg_driver_profile
    description: "State terbaru driver profile dari CDC events (driver_profile_events). Timestamps di-cast dari STRING Debezium ke TIMESTAMP. Deduplicated: 1 row per driver_id, ambil LSN tertinggi."
    columns:
      - name: driver_id
        tests: [not_null, unique]
      - name: user_id
        tests: [not_null, unique]
      - name: driver_status
        tests:
          - accepted_values:
              arguments:
                values: ['AVAILABLE','ON_RIDE','OFFLINE','SUSPENDED']
      - name: _cdc_lsn
        tests: [not_null]

  - name: stg_payment_transaction
    description: "State terbaru payment transaction dari CDC events (payment_transaction_events). Timestamps di-cast dari STRING Debezium ke TIMESTAMP. Deduplicated: 1 row per transaction_id, ambil LSN tertinggi."
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: payment_status
        tests:
          - accepted_values:
              arguments:
                values: ['AUTHORIZED','CAPTURED','PAID','FAILED','REFUNDED']
      - name: _cdc_lsn
        tests: [not_null]

  # ── Batch-backed staging (source: dev_bronze_pg) ────────────────────────────
  # Timestamps sudah TIMESTAMP. Tidak ada deduplication.

  - name: stg_user_account
    description: "User accounts (rider & driver). Batch upsert hourly."
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: account_status
        tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE','SUSPENDED','DELETED']

  - name: stg_vehicle
    description: "Vehicle master data. Batch upsert daily."
    columns:
      - name: vehicle_id
        tests: [not_null, unique]
      - name: vehicle_type
        tests:
          - accepted_values:
              arguments:
                values: ['BIKE','CAR','XL']

  - name: stg_driver_vehicle_assignment
    description: "Relasi driver-vehicle per periode. Batch upsert daily."
    columns:
      - name: assignment_id
        tests: [not_null, unique]

  - name: stg_ride_fare
    description: "Kalkulasi fare per ride. Append-only batch hourly."
    columns:
      - name: fare_id
        tests: [not_null, unique]
      - name: fare_type
        tests:
          - accepted_values:
              arguments:
                values: ['ESTIMATED','FINAL','ADJUSTED']

  - name: stg_ride_fare_component
    description: "Breakdown komponen fare. Append-only batch hourly."
    columns:
      - name: fare_component_id
        tests: [not_null, unique]

  - name: stg_ride_location
    description: "Koordinat pickup/dropoff per ride. Append-only batch. Grain: 1 baris per location_type per ride."
    columns:
      - name: ride_location_id
        tests: [not_null, unique]
      - name: location_type
        tests:
          - accepted_values:
              arguments:
                values: ['PICKUP_REQUESTED','DROPOFF_REQUESTED','PICKUP_ACTUAL','DROPOFF_ACTUAL']

  - name: stg_ride_status_history
    description: "Log perubahan status ride. Append-only batch."
    columns:
      - name: ride_status_history_id
        tests: [not_null, unique]

  - name: stg_ride_tracking_point
    description: "GPS tracking points selama ride. Append-only batch, high-volume. Tidak dipakai langsung di fct_rides — gunakan untuk analisis rute terpisah."
    columns:
      - name: tracking_point_id
        tests: [not_null]

  - name: stg_payment_method_type
    description: "Reference tipe payment method. Batch upsert daily."
    columns:
      - name: payment_method_type_id
        tests: [not_null, unique]
      - name: method_code
        tests: [not_null, unique]

  - name: stg_user_payment_method
    description: "Saved payment methods per user. Batch upsert daily."
    columns:
      - name: user_payment_method_id
        tests: [not_null, unique]

  - name: stg_payment_refund
    description: "Refund records per transaction. Batch upsert hourly."
    columns:
      - name: refund_id
        tests: [not_null, unique]

  - name: stg_review
    description: "Ride reviews (rider↔driver). Batch upsert hourly."
    columns:
      - name: review_id
        tests: [not_null, unique]
      - name: review_type
        tests:
          - accepted_values:
              arguments:
                values: ['RIDER_TO_DRIVER','DRIVER_TO_RIDER']

  - name: stg_promotion
    description: "Promo master data. Batch upsert daily."
    columns:
      - name: promotion_id
        tests: [not_null, unique]

  - name: stg_promo_usage
    description: "Record pemakaian promo per ride. Append-only batch hourly."
    columns:
      - name: promo_usage_id
        tests: [not_null, unique]
      - name: ride_id
        tests: [not_null, unique]

  - name: stg_driver_document
    description: "Dokumen verifikasi driver (SIM, STNK, dll). Batch upsert daily."
    columns:
      - name: document_id
        tests: [not_null, unique]