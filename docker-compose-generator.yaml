# docker-compose-generator.fixed.yaml
# Data generator + PostgreSQL source DB.
# Service ini berbagi external network ride-network dengan Airflow/Trino.

---
services:
  postgres-ops:
    image: postgres:14-alpine
    container_name: postgres-ops
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ride_ops_pg}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Jakarta
    ports: ["5433:5432"]
    volumes:
      - postgres-ops-data:/var/lib/postgresql/data
      - ./data-generator/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ride_ops_pg}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ride-network

  mysql-billing:
    image: mysql:8-debian
    container_name: mysql-billing
    command: --default-authentication-plugin=mysql_native_password --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-billing_growth_db}
      MYSQL_USER: ${MYSQL_USER:-ride_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ride_pass}
      TZ: Asia/Jakarta
    ports: ["3307:3306"]
    volumes:
      - mysql-billing-data:/var/lib/mysql
      - ./data-generator/init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-ride_user}", "-p${MYSQL_PASSWORD:-ride_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ride-network

  data-generator:
    build: ./data-generator
    container_name: data-generator
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-ops:5432/${POSTGRES_DB:-ride_ops_pg}
      MYSQL_HOST: mysql-billing
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DATABASE:-billing_growth_db}
      MYSQL_USER: ${MYSQL_USER:-ride_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ride_pass}
      TZ: Asia/Jakarta
      GENERATOR_MODE: ${GENERATOR_MODE:-portfolio}
      SIM_START_AT: ${SIM_START_AT:-2024-01-01T00:00:00+07:00}
      SIM_SECONDS_PER_MINUTE: ${SIM_SECONDS_PER_MINUTE:-0.5}
      RIDES_PER_MINUTE: ${RIDES_PER_MINUTE:-3}
      SEED_RIDERS: ${SEED_RIDERS:-600}
      SEED_DRIVERS: ${SEED_DRIVERS:-180}
      SEED_PROMOTIONS: ${SEED_PROMOTIONS:-12}
      ENABLE_MAINTENANCE_EVENTS: ${ENABLE_MAINTENANCE_EVENTS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres-ops:
        condition: service_healthy
      mysql-billing:
        condition: service_healthy
    networks: 
      - ride-network

networks:
  ride-network:
    external: true

volumes:
  postgres-ops-data:
  mysql-billing-data:
