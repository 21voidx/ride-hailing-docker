version: 2

models:
  - name: fct_rides
    description: >
      Fact table for rides. Incremental (CDC buffer 1 hour).
      Partitioned by ride_date, clustered by city_code/service_type/ride_status.
    columns:
      - name: ride_id
        tests: [not_null, unique]
      - name: rider_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_rider')
              field: user_id
      - name: driver_id
        tests:
          - relationships:
              to: ref('dim_driver')
              field: driver_id
      - name: vehicle_id
        tests:
          - relationships:
              to: ref('dim_vehicle')
              field: vehicle_id
      - name: ride_status
        tests:
          - not_null
          - accepted_values:
              values: [REQUESTED, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED, PAYMENT_FAILED]
      - name: service_type
        tests:
          - not_null
          - accepted_values:
              values: [BIKE, CAR, XL]
      - name: city_code
        tests: [not_null]
      - name: ride_date
        tests: [not_null]
      - name: total_fare
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "total_fare is not null"
      - name: base_fare
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "base_fare is not null"
      - name: distance_km
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "distance_km is not null"
      - name: surge_multiplier
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              row_condition: "surge_multiplier is not null"
      - name: is_completed
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_cancelled
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_cancelled_by_rider
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_cancelled_by_driver
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: has_surge
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: has_promo
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: fct_payments
    description: >
      Fact table for payment transactions. Incremental (CDC buffer 1 hour).
      Partitioned by txn_date, clustered by payment_status/provider_name.
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: ride_id
        tests: [not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_rider')
              field: user_id
      - name: payment_method_type_id
        tests:
          - relationships:
              to: ref('dim_payment_method_type')
              field: payment_method_type_id
      - name: payment_status
        tests:
          - not_null
          - accepted_values:
              values: [AUTHORIZED, CAPTURED, PAID, FAILED, REFUNDED]
      - name: txn_date
        tests: [not_null]
      - name: amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: method_fee
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: net_amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_refunded
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: is_paid
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_failed
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_refunded
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: fct_reviews
    description: >
      Review fact table. Full refresh table (daily).
      Partitioned by review_date, clustered by review_type.
    columns:
      - name: review_id
        tests: [not_null, unique]
      - name: ride_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_rides')
              field: ride_id
      - name: reviewer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_rider')
              field: user_id
      - name: reviewee_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_rider')
              field: user_id
      - name: review_type
        tests:
          - not_null
          - accepted_values:
              values: [RIDER_TO_DRIVER, DRIVER_TO_RIDER]
      - name: rating_score
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
      - name: review_date
        tests: [not_null]
      - name: is_positive
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: fct_ride_status_transitions
    description: >
      Ride status transition fact. Incremental (batch buffer 1 hour).
      Partitioned by changed_date, clustered by new_status/old_status.
    columns:
      - name: ride_status_history_id
        tests: [not_null, unique]
      - name: ride_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_rides')
              field: ride_id
      - name: new_status
        tests: [not_null]
      - name: changed_date
        tests: [not_null]
      - name: duration_seconds_in_prev_status
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "duration_seconds_in_prev_status is not null and not is_anomaly"
      - name: is_anomaly
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
