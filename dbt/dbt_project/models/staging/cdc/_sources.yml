version: 2

sources:
  - name: dev_bronze_cdc_current
    database: dbt-taxi-explore
    schema: dev_bronze_cdc_current
    description: >
      Debezium CDC current-state views — deduplicated, one row per PK.
      All timestamps stored as STRING in Debezium ISO-8601 format.
    freshness:
      warn_after:
        count: 2
        period: hour
      error_after:
        count: 6
        period: hour
    loaded_at_field: "TIMESTAMP_MILLIS(__source_ts_ms)"
    tables:
      - name: ride
        description: Current state of the ride table from Debezium CDC.
      - name: driver_profile
        description: Current state of the driver_profile table from Debezium CDC.
      - name: payment_transaction
        description: Current state of the payment_transaction table from Debezium CDC.

  - name: dev_bronze_cdc_events
    database: dbt-taxi-explore
    schema: dev_bronze_cdc_events
    description: >
      Debezium CDC append-only event log — partitioned by hour.
      Must always filter with cdc_partition_filter() macro.
    freshness:
      warn_after:
        count: 2
        period: hour
      error_after:
        count: 6
        period: hour
    loaded_at_field: "TIMESTAMP_MILLIS(__source_ts_ms)"
    tables:
      - name: ride_events
        description: Append-only CDC event log for the ride table.
      - name: payment_transaction_events
        description: Append-only CDC event log for the payment_transaction table.
