name: ride_hailing
version: '1.0.0'
config-version: 2

profile: ride_hailing

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  source_project: dbt-taxi-explore
  batch_bronze_dataset: dev_bronze_pg
  cdc_bronze_dataset: dev_bronze_cdc_events
  cdc_lookback_hours: 720        # 30 days. For initial production full-refresh, override to a wider window.
  incremental_lookback_days: 3
  reporting_start_date: '2026-03-01'
  timezone: Asia/Jakarta

quoting:
  database: true
  schema: true
  identifier: true

models:
  ride_hailing:
    +persist_docs:
      relation: true
      columns: true
    +labels:
      domain: ride_hailing
      managed_by: dbt
      project_layer: analytics
    staging:
      +schema: silver_ride
      +materialized: view
      +tags: ['staging']
    intermediate:
      +schema: silver_ride
      +materialized: view
      +tags: ['intermediate']
      cdc:
        +materialized: incremental
        +incremental_strategy: merge
        +on_schema_change: sync_all_columns
        +tags: ['intermediate', 'cdc_latest']
      metrics:
        +materialized: incremental
        +incremental_strategy: insert_overwrite
        +on_schema_change: sync_all_columns
        +tags: ['intermediate', 'metrics']
    marts:
      +schema: gold_ride
      +materialized: table
      +tags: ['marts']
      facts:
        +materialized: incremental
        +incremental_strategy: insert_overwrite
        +on_schema_change: sync_all_columns
        +tags: ['marts', 'facts']
    reporting:
      +schema: reporting_ride
      +materialized: incremental
      +incremental_strategy: insert_overwrite
      +on_schema_change: sync_all_columns
      +tags: ['reporting', 'looker']

tests:
  ride_hailing:
    +store_failures: true
    +schema: audit_ride
