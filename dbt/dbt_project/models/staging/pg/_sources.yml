version: 2

sources:
  - name: dev_bronze_pg
    database: dbt-taxi-explore
    schema: dev_bronze_pg
    description: Batch-ingested tables from PostgreSQL via Airflow + Trino.
    freshness:
      warn_after:
        count: 25
        period: hour
      error_after:
        count: 49
        period: hour
    loaded_at_field: updated_at
    tables:
      - name: user_account
        description: Rider and driver accounts.
      - name: role
        description: Application role definitions.
      - name: user_role
        description: User-to-role assignments.
        loaded_at_field: assigned_at
      - name: driver_profile
        description: Driver-specific profile data.
      - name: driver_document
        description: Driver KYC documents.
      - name: vehicle
        description: Registered vehicles.
      - name: driver_vehicle_assignment
        description: Driver-vehicle assignment periods.
      - name: ride
        description: Ride records.
      - name: ride_status_history
        description: Ride lifecycle status transitions.
        loaded_at_field: created_at
      - name: ride_location
        description: Pickup and dropoff location records.
        loaded_at_field: created_at
      - name: ride_fare
        description: Fare calculations per ride (ESTIMATED / FINAL / ADJUSTED).
        loaded_at_field: created_at
      - name: ride_fare_component
        description: Itemised fare components.
        loaded_at_field: created_at
      - name: payment_method_type
        description: Lookup table for payment method types.
      - name: user_payment_method
        description: Saved payment methods per user.
      - name: payment_transaction
        description: Payment transaction records.
      - name: payment_refund
        description: Refund records.
      - name: review
        description: Rider/driver mutual reviews.
      - name: promotion
        description: Promotion definitions.
      - name: promo_usage
        description: Per-ride promo application records.
        loaded_at_field: created_at
