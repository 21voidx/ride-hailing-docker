version: 2

models:
  - name: int__ride_enriched
    description: >
      Enriched ride records: FINAL fare joined, locations pivoted,
      promo usage left-joined. Incremental (CDC buffer 1 hour).
    columns:
      - name: ride_id
        tests: [not_null, unique]
      - name: rider_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_pg__users')
              field: user_id
      - name: ride_status
        tests:
          - not_null
          - accepted_values:
              values: [REQUESTED, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED, PAYMENT_FAILED]
      - name: service_type
        tests:
          - not_null
          - accepted_values:
              values: [BIKE, CAR, XL]
      - name: city_code
        tests: [not_null]
      - name: requested_at
        tests: [not_null]
      - name: is_completed
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_cancelled
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_cancelled_by_rider
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_cancelled_by_driver
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: has_surge
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: has_promo
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: total_fare
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "total_fare is not null"
      - name: __source_ts_ms
        tests: [not_null]

  - name: int__driver_enriched
    description: >
      Driver profile enriched with user info, active vehicle assignment,
      vehicle details, and aggregated document verification status.
    columns:
      - name: driver_id
        tests: [not_null, unique]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_pg__users')
              field: user_id
      - name: driver_status
        tests:
          - not_null
          - accepted_values:
              values: [AVAILABLE, ON_RIDE, OFFLINE, SUSPENDED]
      - name: verification_status
        tests:
          - not_null
          - accepted_values:
              values: [PENDING, VERIFIED, REJECTED]
      - name: rating_avg
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1.0
              max_value: 5.0
      - name: all_docs_verified
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: int__payment_enriched
    description: >
      Payment transactions enriched with refund aggregates, payment method
      and method type details. Incremental (CDC buffer 1 hour).
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: ride_id
        tests: [not_null]
      - name: amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: net_amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_refunded
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: payment_status
        tests:
          - not_null
          - accepted_values:
              values: [AUTHORIZED, CAPTURED, PAID, FAILED, REFUNDED]
      - name: is_paid
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_failed
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_refunded
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: __source_ts_ms
        tests: [not_null]

  - name: int__ride_status_transitions
    description: >
      Ride status history enriched with LAG-based duration in previous status,
      anomaly detection, and CDC event tiebreaker columns.
      Incremental (batch buffer 1 hour on changed_at).
    columns:
      - name: ride_status_history_id
        tests: [not_null, unique]
      - name: ride_id
        tests: [not_null]
      - name: new_status
        tests: [not_null]
      - name: changed_at
        tests: [not_null]
      - name: is_anomaly
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: int__payment_audit_trail
    description: >
      One row per CDC event for payment transactions.
      Detects retries (>1 AUTHORIZED event) and status rollbacks.
      Incremental (partition filter 3 days + CDC buffer 1 hour).
    columns:
      - name: audit_key
        description: Surrogate key on (transaction_id, __lsn).
        tests: [not_null, unique]
      - name: transaction_id
        tests: [not_null]
      - name: __lsn
        tests: [not_null]
      - name: payment_status
        tests:
          - not_null
          - accepted_values:
              values: [AUTHORIZED, CAPTURED, PAID, FAILED, REFUNDED]
      - name: is_retry
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_status_rollback
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: __source_ts_ms
        tests: [not_null]

  - name: int__rider_lifetime
    description: >
      Lifetime aggregates per rider computed from int__ride_enriched.
      Materialised as table (daily full refresh).
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: total_rides
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: completed_rides
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: cancelled_rides
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_spend
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
