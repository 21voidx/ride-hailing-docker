name: dbt_ride_ops
version: "1.0.0"
config-version: 2
profile: dbt_ride_ops

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  start_date: "2020-01-01"
  bq_location: "asia-southeast1"

models:
  dbt_ride_ops:
    staging:
      +materialized: view
      +tags: []
      cdc:
        +tags: ["hourly"]
        +schema: staging_cdc
      pg:
        +tags: ["daily"]
        +schema: staging_pg
    intermediate:
      +materialized: view
      +tags: ["daily"]
      +schema: intermediate
      int__ride_enriched:
        +materialized: incremental
        +tags: ["hourly"]
        +on_schema_change: sync_all_columns
        +partition_by:
          field: ride_date
          data_type: date
        +cluster_by: ["city_code", "service_type"]
      int__payment_enriched:
        +materialized: incremental
        +tags: ["hourly"]
        +on_schema_change: sync_all_columns
        +partition_by:
          field: txn_date
          data_type: date
      int__ride_status_transitions:
        +materialized: incremental
        +tags: ["daily"]
        +on_schema_change: sync_all_columns
        +partition_by:
          field: changed_date
          data_type: date
      int__rider_lifetime:
        +materialized: incremental
        +tags: ["daily"]
        +on_schema_change: sync_all_columns
    marts:
      +materialized: table
      +schema: marts
      dims:
        +tags: ["daily"]
      facts:
        +schema: marts
        fct_rides:
          +materialized: incremental
          +tags: ["hourly"]
          +on_schema_change: sync_all_columns
          +partition_by:
            field: ride_date
            data_type: date
          +cluster_by: ["city_code", "service_type", "ride_status"]
        fct_payments:
          +materialized: incremental
          +tags: ["hourly"]
          +on_schema_change: sync_all_columns
          +partition_by:
            field: txn_date
            data_type: date
          +cluster_by: ["payment_status", "provider_name"]
        fct_reviews:
          +tags: ["daily"]
          +partition_by:
            field: review_date
            data_type: date
          +cluster_by: ["review_type"]
        fct_ride_status_transitions:
          +materialized: incremental
          +tags: ["daily"]
          +on_schema_change: sync_all_columns
          +partition_by:
            field: changed_date
            data_type: date
          +cluster_by: ["new_status"]
      aggregates:
        +tags: ["daily"]
        +schema: marts
