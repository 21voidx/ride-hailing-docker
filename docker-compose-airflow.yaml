# docker-compose-airflow.fixed.yaml
# Airflow + Trino on Docker bridge network.
# Antar-container gunakan nama service: postgres, trino, postgres-ops.
# Jangan gunakan 127.0.0.1 untuk koneksi antar-container.

---
x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
    # Opsional: hanya untuk proses build/pip install jika DNS build bermasalah.
    # Tidak memengaruhi network runtime container.
    network: host
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    # Airflow metadata database: gunakan hostname service Docker, bukan 127.0.0.1.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

    # Tidak dipakai LocalExecutor, tetapi aman dibiarkan kosong/kompatibel bila nanti pindah executor.
    # AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
    # AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__SECRET_KEY: ${AIRFLOW__CORE__SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}

    AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.getfqdn
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

    # Airflow 3 internal execution API URL: gunakan nama service apiserver.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '60'
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg

    # Google Cloud credentials di dalam container.
    GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp/service-account.json
    # GCP_PROJECT_ID: ${GCP_PROJECT_ID}

    # Variabel praktis untuk DAG/operator/custom script.
    # TRINO_HOST: trino
    # TRINO_PORT: '8082'
    # POSTGRES_AIRFLOW_HOST: postgres
    # POSTGRES_AIRFLOW_PORT: '5432'
    # POSTGRES_OPS_HOST: postgres-ops
    # POSTGRES_OPS_PORT: '5432'

    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ./credentials/service-account.json:/opt/gcp/service-account.json:ro
    # Hapus mount docker.sock jika DAG tidak perlu menjalankan Docker dari Airflow.
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    # Sesuaikan dengan GID docker group di host: getent group docker
    - "${DOCKER_GID:-988}"
  dns:
    - 8.8.8.8
    - 1.1.1.1
  extra_hosts:
    # Dipakai hanya jika DAG perlu mengakses service yang berjalan langsung di host.
    - "host.docker.internal:host-gateway"
  networks:
    - ride-network
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:14-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5432:5432"
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - ride-network

  trino:
    image: trinodb/trino:477
    container_name: trino
    ports:
      # Jika ingin hanya lewat Tailscale Serve, ubah menjadi "127.0.0.1:8082:8082".
      - "8082:8082"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/etc/jvm.config:/etc/trino/jvm.config
      - ./trino/etc/config.properties:/etc/trino/config.properties
      - ./credentials/service-account.json:/opt/gcp/service-account.json:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ride_ops_pg}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-billing_growth_db}
      MYSQL_USER: ${MYSQL_USER:-ride_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ride_pass}

      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp/service-account.json
    healthcheck:
      # File ./trino/etc/config.properties Anda harus memakai http-server.http.port=8082.
      # Jika port Trino di config.properties berbeda, samakan baris ini dan ports di atas.
      test: ["CMD", "curl", "-f", "http://localhost:8082/v1/info"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always
    networks:
      - ride-network

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      # Untuk akses dari Tailscale IP langsung: http://<tailscale-ip>:8080
      # Jika ingin lebih ketat, ubah ke "127.0.0.1:8080:8080" dan gunakan tailscale serve.
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "Set AIRFLOW_UID in .env on Linux to avoid root-owned files."
          echo "Example: echo AIRFLOW_UID=$$(id -u) >> .env"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi

        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"

        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory recommended. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          warning_resources="true"
        fi

        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUs available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          warning_resources="true"
        fi

        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough disk space available for Docker.\e[0m"
          echo "At least 10 GB recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          warning_resources="true"
        fi

        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: Resource check found a potential issue.\e[0m"
          echo
        fi

        echo "Creating missing Airflow directories..."
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}

        echo "Airflow version:"
        /entrypoint airflow version

        echo "Generate default config if missing..."
        /entrypoint airflow config list >/dev/null

        echo "Fix ownership..."
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    container_name: airflow-cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: '0'
    command:
      - bash
      - -c
      - airflow
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy

volumes:
  airflow-db-data:
  airflow-logs:

networks:
  ride-network:
    external: true
