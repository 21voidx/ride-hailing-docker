version: 2

models:
  - name: stg_pg__users
    description: >
      User accounts (riders and drivers). Excludes password_hash.
      Adds signup_date in Asia/Jakarta timezone.
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: username
        tests: [not_null, unique]
      - name: account_status
        tests:
          - not_null
          - accepted_values:
              values: [ACTIVE, SUSPENDED, DELETED]
      - name: created_at
        tests: [not_null]
      - name: updated_at
        tests: [not_null]
      - name: signup_date
        tests: [not_null]

  - name: stg_pg__vehicles
    description: Registered vehicles. Adds is_active boolean from vehicle_status.
    columns:
      - name: vehicle_id
        tests: [not_null, unique]
      - name: license_plate
        tests: [not_null, unique]
      - name: vehicle_make
        tests: [not_null]
      - name: vehicle_model
        tests: [not_null]
      - name: vehicle_type
        tests:
          - not_null
          - accepted_values:
              values: [BIKE, CAR, XL]
      - name: vehicle_status
        tests:
          - not_null
          - accepted_values:
              values: [ACTIVE, INACTIVE, SUSPENDED]
      - name: vehicle_year
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 2000
              max_value: 2035
      - name: vehicle_capacity
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 12
      - name: is_active
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

  - name: stg_pg__driver_documents
    description: Driver KYC documents. Derives is_verified and is_expired booleans.
    columns:
      - name: document_id
        tests: [not_null, unique]
      - name: driver_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_cdc__driver_profiles')
              field: driver_id
      - name: document_type
        tests:
          - not_null
          - accepted_values:
              values: [KTP, SIM, STNK, SKCK]
      - name: document_number
        tests: [not_null]
      - name: verification_status
        tests:
          - not_null
          - accepted_values:
              values: [PENDING, VERIFIED, REJECTED]
      - name: submitted_at
        tests: [not_null]
      - name: is_verified
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_expired
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

  - name: stg_pg__driver_vehicle_assignments
    description: >
      Driver-vehicle assignment periods. Adds is_currently_active
      (is_active AND no end date or future end date).
    columns:
      - name: assignment_id
        tests: [not_null, unique]
      - name: driver_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_cdc__driver_profiles')
              field: driver_id
      - name: vehicle_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_pg__vehicles')
              field: vehicle_id
      - name: assigned_from
        tests: [not_null]
      - name: is_active
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_currently_active
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

  - name: stg_pg__ride_fares
    description: >
      Fare records for rides — all types (ESTIMATED, FINAL, ADJUSTED) are kept.
      Business filter to FINAL rows happens in int__ride_enriched.
    columns:
      - name: fare_id
        tests: [not_null, unique]
      - name: ride_id
        tests: [not_null]
      - name: fare_type
        tests:
          - not_null
          - accepted_values:
              values: [ESTIMATED, FINAL, ADJUSTED]
      - name: fare_version
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
      - name: distance_km
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: true
      - name: duration_min
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: true
      - name: base_fare
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: distance_fare
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: time_fare
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: surge_multiplier
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
      - name: surge_amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: discount_amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: tax_amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: platform_fee
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: driver_earning
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_fare
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: calculated_at
        tests: [not_null]

  - name: stg_pg__ride_fare_components
    description: Itemised components of each fare record.
    columns:
      - name: fare_component_id
        tests: [not_null, unique]
      - name: fare_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_pg__ride_fares')
              field: fare_id
      - name: component_code
        tests: [not_null]
      - name: component_name
        tests: [not_null]
      - name: component_amount
        tests: [not_null]

  - name: stg_pg__ride_locations
    description: >
      Pickup and dropoff location records — one row per location_type per ride.
      Pivoting (to pickup_lat/lng, dropoff_lat/lng) happens in int__ride_enriched.
    columns:
      - name: ride_location_id
        tests: [not_null, unique]
      - name: ride_id
        tests: [not_null]
      - name: location_type
        tests:
          - not_null
          - accepted_values:
              values: [PICKUP_REQUESTED, DROPOFF_REQUESTED, PICKUP_ACTUAL, DROPOFF_ACTUAL]
      - name: latitude
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -90
              max_value: 90
      - name: longitude
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -180
              max_value: 180
      - name: captured_at
        tests: [not_null]

  - name: stg_pg__ride_status_history
    description: Ride lifecycle status transition log. Adds changed_date in WIB.
    columns:
      - name: ride_status_history_id
        tests: [not_null, unique]
      - name: ride_id
        tests: [not_null]
      - name: new_status
        tests: [not_null]
      - name: changed_at
        tests: [not_null]
      - name: changed_date
        tests: [not_null]

  - name: stg_pg__reviews
    description: Rider-to-driver and driver-to-rider reviews.
    columns:
      - name: review_id
        tests: [not_null, unique]
      - name: ride_id
        tests: [not_null]
      - name: reviewer_id
        tests: [not_null]
      - name: reviewee_id
        tests: [not_null]
      - name: review_type
        tests:
          - not_null
          - accepted_values:
              values: [RIDER_TO_DRIVER, DRIVER_TO_RIDER]
      - name: rating_score
        description: Rating 1–5.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
      - name: review_date
        tests: [not_null]
      - name: is_positive
        description: True when rating_score >= 4.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

  - name: stg_pg__promotions
    description: Promotion definitions. Adds is_currently_valid derived boolean.
    columns:
      - name: promotion_id
        tests: [not_null, unique]
      - name: promo_code
        tests: [not_null, unique]
      - name: discount_type
        tests:
          - not_null
          - accepted_values:
              values: [PERCENT, FIXED]
      - name: discount_pct
        description: Discount percentage (0–100), nullable for FIXED type.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              row_condition: "discount_type = 'PERCENT'"
      - name: min_fare_amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: promotion_status
        tests:
          - not_null
          - accepted_values:
              values: [ACTIVE, INACTIVE, EXPIRED]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]
      - name: is_currently_valid
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

  - name: stg_pg__promo_usages
    description: Per-ride promo application records.
    columns:
      - name: promo_usage_id
        tests: [not_null, unique]
      - name: promotion_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_pg__promotions')
              field: promotion_id
      - name: ride_id
        tests: [not_null, unique]
      - name: rider_id
        tests: [not_null]
      - name: discount_amount_applied
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: used_at
        tests: [not_null]

  - name: stg_pg__payment_refunds
    description: Refund records per payment transaction.
    columns:
      - name: refund_id
        tests: [not_null, unique]
      - name: transaction_id
        tests: [not_null]
      - name: refund_amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: refund_status
        tests:
          - not_null
          - accepted_values:
              values: [REQUESTED, COMPLETED, FAILED]
      - name: requested_at
        tests: [not_null]
      - name: is_completed
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

  - name: stg_pg__user_payment_methods
    description: >
      Saved payment methods per user.
      Sensitive fields provider_customer_id and provider_payment_token are excluded.
    columns:
      - name: user_payment_method_id
        tests: [not_null, unique]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_pg__users')
              field: user_id
      - name: payment_method_type_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_pg__payment_method_types')
              field: payment_method_type_id
      - name: payment_method_status
        tests:
          - not_null
          - accepted_values:
              values: [ACTIVE, EXPIRED, DISABLED]
      - name: expiry_month
        description: Card expiry month (1–12, nullable for non-card methods).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 12
              row_condition: "expiry_month is not null"
      - name: expiry_year
        description: Card expiry year (2024–2045, nullable for non-card methods).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 2024
              max_value: 2045
              row_condition: "expiry_year is not null"
      - name: is_default
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

  - name: stg_pg__payment_method_types
    description: Lookup table for payment method types (CASH, CARD, EWALLET, BANK_TRANSFER).
    columns:
      - name: payment_method_type_id
        tests: [not_null, unique]
      - name: method_code
        tests: [not_null, unique]
      - name: method_name
        tests: [not_null]
      - name: is_active
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

  - name: stg_pg__roles
    description: Application role definitions (RIDER, DRIVER, ADMIN).
    columns:
      - name: role_id
        tests: [not_null, unique]
      - name: role_code
        tests: [not_null, unique]
      - name: role_name
        tests: [not_null]
      - name: is_active
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

  - name: stg_pg__user_roles
    description: User-to-role assignments. Composite PK on (user_id, role_id).
    columns:
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_pg__users')
              field: user_id
      - name: role_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_pg__roles')
              field: role_id
      - name: assigned_at
        tests: [not_null]
      - name: is_active
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [user_id, role_id]
