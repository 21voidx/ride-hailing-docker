name: ride_hailing
version: "1.0.0"
config-version: 2
profile: ride_hailing_bigquery

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  dbt_date:time_zone: "Asia/Jakarta"

models:
  ride_hailing:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: "{{ env_var('BQ_STAGING_DATASET', 'stg_ride_hailing') }}"
    intermediate:
      +materialized: ephemeral
      +schema: "{{ env_var('BQ_INTERMEDIATE_DATASET', 'int_ride_hailing') }}"
    marts:
      +schema: "{{ env_var('BQ_MART_DATASET', 'mart_ride_hailing') }}"
      dim:
        +materialized: table
      fact:
        +materialized: incremental
        +on_schema_change: sync_all_columns
      agg:
        +materialized: incremental
        +on_schema_change: sync_all_columns
