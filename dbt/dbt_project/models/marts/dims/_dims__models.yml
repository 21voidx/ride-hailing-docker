version: 2

models:
  - name: dim_date
    description: >
      Date spine from 2020-01-01 to current_date + 1 year.
      Enriched with Indonesian public holidays from seed.
    columns:
      - name: date_day
        tests: [not_null, unique]
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 4
      - name: month
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 12
      - name: day_of_week
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 7
      - name: is_weekend
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: is_public_holiday
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: season
        tests:
          - not_null
          - accepted_values:
              values: [Q1, Q2, Q3, Q4]

  - name: dim_rider
    description: >
      One row per rider (SCD Type 1). Includes lifetime stats and
      computed segment and cohort_month.
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: username
        tests: [not_null]
      - name: account_status
        tests:
          - not_null
          - accepted_values:
              values: [ACTIVE, SUSPENDED, DELETED]
      - name: signup_date
        tests: [not_null]
      - name: cohort_month
        tests: [not_null]
      - name: segment
        tests:
          - not_null
          - accepted_values:
              values: [new, active, at_risk, churned]
      - name: total_rides
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_spend
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: dim_driver
    description: One row per driver (SCD Type 1). Includes verification and vehicle info.
    columns:
      - name: driver_id
        tests: [not_null, unique]
      - name: user_id
        tests: [not_null]
      - name: driver_status
        tests:
          - not_null
          - accepted_values:
              values: [AVAILABLE, ON_RIDE, OFFLINE, SUSPENDED]
      - name: verification_status
        tests:
          - not_null
          - accepted_values:
              values: [PENDING, VERIFIED, REJECTED]
      - name: rating_avg
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1.0
              max_value: 5.0
      - name: rating_count
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: all_docs_verified
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: dim_vehicle
    description: One row per vehicle.
    columns:
      - name: vehicle_id
        tests: [not_null, unique]
      - name: license_plate
        tests: [not_null, unique]
      - name: vehicle_type
        tests:
          - not_null
          - accepted_values:
              values: [BIKE, CAR, XL]
      - name: vehicle_status
        tests:
          - not_null
          - accepted_values:
              values: [ACTIVE, INACTIVE, SUSPENDED]
      - name: vehicle_year
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 2000
              max_value: 2035
      - name: vehicle_capacity
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 12
      - name: is_active
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: dim_promotion
    description: One row per promotion.
    columns:
      - name: promotion_id
        tests: [not_null, unique]
      - name: promo_code
        tests: [not_null, unique]
      - name: discount_type
        tests:
          - not_null
          - accepted_values:
              values: [PERCENT, FIXED]
      - name: discount_pct
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              row_condition: "discount_type = 'PERCENT'"
      - name: promotion_status
        tests:
          - not_null
          - accepted_values:
              values: [ACTIVE, INACTIVE, EXPIRED]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]
      - name: is_currently_valid
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: dim_payment_method_type
    description: Lookup table for payment method types.
    columns:
      - name: payment_method_type_id
        tests: [not_null, unique]
      - name: method_code
        tests: [not_null, unique]
      - name: method_name
        tests: [not_null]
      - name: is_active
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
