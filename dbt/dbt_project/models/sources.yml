version: 2

sources:
  # ─────────────────────────────────────────────────────────────────────────────
  # Source 1: CDC Events (Debezium → Kafka → GCS → BigQuery)
  # Dataset  : dev_bronze_cdc_events
  # ─────────────────────────────────────────────────────────────────────────────
  - name: ride_ops_cdc
    description: "Raw CDC events dari Debezium yang memonitor PostgreSQL ride_ops_pg. Setiap row merepresentasikan satu CDC event (INSERT/UPDATE/DELETE). Di-load via Debezium → Kafka → GCS → BigQuery."
    database: "{{ var('source_project', 'dbt-taxi-explore') }}"
    schema: "{{ var('bronze_cdc_schema', 'dev_bronze_cdc_events') }}"
    config:
      loaded_at_field: "TIMESTAMP_MILLIS(__source_ts_ms)"
      freshness:
        warn_after: {count: 1, period: hour}
        error_after: {count: 3, period: hour}
        filter: "_PARTITIONTIME >= timestamp_sub(current_timestamp(), interval 2 day)"

    tables:
      - name: ride_events
      - name: driver_profile_events
      - name: payment_transaction_events

  # ─────────────────────────────────────────────────────────────────────────────
  # Source 2: Batch (Airflow → BigQuery)
  # Dataset  : dev_bronze_pg
  # ─────────────────────────────────────────────────────────────────────────────
  - name: ride_ops_batch
    description: "Raw tables dari PostgreSQL ride_ops_pg yang di-load ke BigQuery via Airflow batch job (daily / hourly). Timestamps sudah bertipe TIMESTAMP. Ada kolom _ingested_at dan _source_system."
    database: "{{ var('source_project', 'dbt-taxi-explore') }}"
    schema: "{{ var('bronze_batch_schema', 'dev_bronze_pg') }}"
    config:
      loaded_at_field: "_ingested_at"
      freshness:
        warn_after: {count: 2, period: hour}
        error_after: {count: 6, period: hour}

    tables:
      - name: ride_status_history
      - name: ride_location
      - name: ride_tracking_point
      - name: ride_fare
      - name: ride_fare_component
      - name: promo_usage
      - name: role
      - name: payment_method_type
      - name: promotion
      - name: user_account
      - name: user_role
      - name: driver_document
      - name: vehicle
      - name: driver_vehicle_assignment
      - name: user_payment_method
      - name: review
      - name: payment_refund