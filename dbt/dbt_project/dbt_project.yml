name: 'ride_hailing'
version: '1.0.0'
config-version: 2

profile: 'ride_hailing'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ─────────────────────────────────────────────────────────────────────────────
# Variables
# ─────────────────────────────────────────────────────────────────────────────
vars:
  source_project: dbt-taxi-explore

  # Schema names untuk raw bronze layer
  bronze_cdc_schema: "dev_bronze_cdc_events"   
  bronze_batch_schema: "dev_bronze_pg"     

  # Partition start untuk query CDC tables (require_partition_filter = TRUE)
  # Set ke tanggal mulai data terlama yang relevan
  cdc_partition_start: "2020-01-01"
  reporting_timezone: "Asia/Jakarta"
  incremental_lookback_days: 2

models:
  ride_hailing:

    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: ephemeral

    marts:
      dimensions:
        +materialized: table
        +schema: marts

      facts:
        +materialized: incremental
        +schema: marts
        +on_schema_change: sync_all_columns
